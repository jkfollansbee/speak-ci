name: Speak Private CI

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Branch, tag, or full ref from jkfollansbee/speak to build
        required: false
        type: string
        default: main
      publish_image:
        description: Push images to GHCR under jkfollansbee/speak
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  CHECKOUT_REPOSITORY: jkfollansbee/speak
  CHECKOUT_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || (github.event_name == 'pull_request' && github.head_ref || github.ref_name) }}
  IMAGE_NAME: jkfollansbee/speak
  WEB_IMAGE_NAME: jkfollansbee/speak
  PUBLISH_IMAGE: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_image || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) }}
  REGISTRY_USERNAME: jkfollansbee

jobs:
  test-api:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - name: Checkout private source
        uses: actions/checkout@v7
        with:
          repository: ${{ env.CHECKOUT_REPOSITORY }}
          ref: ${{ env.CHECKOUT_REF }}
          token: ${{ secrets.SPEAK_REPO_TOKEN }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run API tests
        run: go test ./...

  test-proxy:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Checkout private source
        uses: actions/checkout@v7
        with:
          repository: ${{ env.CHECKOUT_REPOSITORY }}
          ref: ${{ env.CHECKOUT_REF }}
          token: ${{ secrets.SPEAK_REPO_TOKEN }}
          persist-credentials: false

      - name: Run standalone proxy topology smoke
        run: ./scripts/test-standalone-proxy-topology.sh

  test-web:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web
    steps:
      - name: Checkout private source
        uses: actions/checkout@v7
        with:
          repository: ${{ env.CHECKOUT_REPOSITORY }}
          ref: ${{ env.CHECKOUT_REF }}
          token: ${{ secrets.SPEAK_REPO_TOKEN }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: npm ci

      - name: Run web unit tests
        run: npm test

  test-web-sites:
    name: test-web-sites (${{ matrix.name }})
    timeout-minutes: 20
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: suite
            specs: tests/standalone-sites.e2e.spec.ts
          - name: language
            specs: tests/dictionary-page.e2e.spec.ts tests/speech-grammar-results.e2e.spec.ts
          - name: voice-agent
            specs: tests/voice-agent-page.e2e.spec.ts
          - name: creative
            specs: tests/music-page.e2e.spec.ts tests/graphic-book-workspace.e2e.spec.ts
          - name: memory
            specs: tests/memory-workspace.e2e.spec.ts
          - name: memos
            specs: tests/memos-page.e2e.spec.ts
    defaults:
      run:
        working-directory: ./web
    steps:
      - name: Checkout private source
        uses: actions/checkout@v7
        with:
          repository: ${{ env.CHECKOUT_REPOSITORY }}
          ref: ${{ env.CHECKOUT_REF }}
          token: ${{ secrets.SPEAK_REPO_TOKEN }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: npm ci

      - name: Set up Chrome browser
        id: setup-chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable

      - name: Install Playwright system dependencies
        run: npx playwright install-deps chromium

      - name: Verify Chrome browser
        run: '"${{ steps.setup-chrome.outputs.chrome-path }}" --version'

      - name: Run mock-site browser shard
        env:
          NEXT_PUBLIC_MOCK_API: "true"
          PLAYWRIGHT_BROWSER_EXECUTABLE_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: npx playwright test ${{ matrix.specs }} --workers=1

      - name: Upload mock-site failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-sites-${{ matrix.name }}-attempt-${{ github.run_attempt }}
          path: web/test-results
          if-no-files-found: ignore
          retention-days: 7

  test-web-base-path:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web
    steps:
      - name: Checkout private source
        uses: actions/checkout@v7
        with:
          repository: ${{ env.CHECKOUT_REPOSITORY }}
          ref: ${{ env.CHECKOUT_REF }}
          token: ${{ secrets.SPEAK_REPO_TOKEN }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: npm ci

      - name: Set up Chrome browser
        id: setup-chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable

      - name: Install Playwright system dependencies
        run: npx playwright install-deps chromium

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build production subpath image
        uses: docker/build-push-action@v7
        with:
          context: ./web
          file: ./web/Dockerfile
          platforms: linux/amd64
          load: true
          tags: speak-web-subpath-e2e:local
          build-args: |
            NEXT_PUBLIC_API_URL=/speak/api/v1
            NEXT_PUBLIC_BASE_PATH=/speak
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Verify Chrome browser
        run: '"${{ steps.setup-chrome.outputs.chrome-path }}" --version'

      - name: Run production subpath image e2e
        env:
          PLAYWRIGHT_BROWSER_EXECUTABLE_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
          WEB_SUBPATH_IMAGE_READY: "true"
        run: npm run test:e2e:base-path

      - name: Upload subpath failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-base-path-attempt-${{ github.run_attempt }}
          path: web/test-results
          if-no-files-found: ignore
          retention-days: 7

  test-web-e2e:
    name: test-web-e2e (${{ matrix.database }})
    timeout-minutes: 30
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres]
    defaults:
      run:
        working-directory: ./web
    steps:
      - name: Checkout private source
        uses: actions/checkout@v7
        with:
          repository: ${{ env.CHECKOUT_REPOSITORY }}
          ref: ${{ env.CHECKOUT_REF }}
          token: ${{ secrets.SPEAK_REPO_TOKEN }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: npm ci

      - name: Set up Chrome browser
        id: setup-chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable

      - name: Install Playwright system dependencies
        run: npx playwright install-deps chromium

      - name: Verify Chrome browser
        run: '"${{ steps.setup-chrome.outputs.chrome-path }}" --version'

      - name: Run full-stack browser e2e
        env:
          E2E_DATABASE_DRIVER: ${{ matrix.database }}
          PLAYWRIGHT_BROWSER_EXECUTABLE_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: npm run test:e2e:ci

      - name: Upload full-stack browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-desktop-${{ matrix.database }}-attempt-${{ github.run_attempt }}
          path: web/test-results
          if-no-files-found: ignore
          retention-days: 7

  test-web-e2e-redroid-mobile:
    name: test-web-e2e-redroid-mobile (${{ matrix.database }})
    timeout-minutes: 45
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres]
    steps:
      - name: Checkout private source
        uses: actions/checkout@v7
        with:
          repository: ${{ env.CHECKOUT_REPOSITORY }}
          ref: ${{ env.CHECKOUT_REF }}
          token: ${{ secrets.SPEAK_REPO_TOKEN }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: ./web
        run: npm ci

      - name: Start redroid Android
        run: ./scripts/ci-start-redroid.sh

      - name: Run redroid mobile full-stack e2e
        working-directory: ./web
        env:
          E2E_DATABASE_DRIVER: ${{ matrix.database }}
        run: npm run test:e2e:ci:redroid

      - name: Upload redroid failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-redroid-${{ matrix.database }}-attempt-${{ github.run_attempt }}
          path: web/test-results
          if-no-files-found: ignore
          retention-days: 7

  quality-gate:
    if: always()
    timeout-minutes: 5
    runs-on: ubuntu-latest
    needs:
      - test-api
      - test-proxy
      - test-web
      - test-web-sites
      - test-web-base-path
      - test-web-e2e
      - test-web-e2e-redroid-mobile
    steps:
      - name: Require every test job
        env:
          REQUIRED_RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          jq -r 'to_entries[] | "\(.key)=\(.value.result)"' <<<"$REQUIRED_RESULTS" | tee -a "$GITHUB_STEP_SUMMARY"
          jq -e 'all(.[]; .result == "success")' <<<"$REQUIRED_RESULTS"

  build-api:
    needs: quality-gate
    timeout-minutes: 90
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout private source
        uses: actions/checkout@v7
        with:
          repository: ${{ env.CHECKOUT_REPOSITORY }}
          ref: ${{ env.CHECKOUT_REF }}
          token: ${{ secrets.SPEAK_REPO_TOKEN }}
          persist-credentials: false

      - name: Resolve image tags
        id: image_tags
        run: |
          set -euo pipefail

          ref_input='${{ env.CHECKOUT_REF }}'
          ref_name="$ref_input"
          latest=false

          if [[ "$ref_input" == refs/tags/* ]]; then
            ref_name="${ref_input#refs/tags/}"
            latest=true
          elif [[ "$ref_input" == refs/heads/* ]]; then
            ref_name="${ref_input#refs/heads/}"
            if [[ "$ref_name" == "main" ]]; then
              latest=true
            fi
          elif [[ "$ref_input" == refs/pull/* ]]; then
            ref_name="pr-${ref_input#refs/pull/}"
            ref_name="${ref_name%%/*}"
          elif [[ "$ref_input" == v* ]]; then
            ref_name="$ref_input"
            latest=true
          elif [[ "$ref_input" == "main" ]]; then
            ref_name=main
            latest=true
          elif [[ -z "$ref_input" ]]; then
            ref_name=detached
          fi

          tag_name="$(printf '%s' "$ref_name" | sed 's/[^A-Za-z0-9_.-]/-/g')"

          echo "tag_name=$tag_name" >> "$GITHUB_OUTPUT"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        if: env.PUBLISH_IMAGE == 'true'
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to registry
        if: env.PUBLISH_IMAGE == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.REGISTRY_USERNAME }}
          password: ${{ secrets.SPEAK_REPO_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.image_tags.outputs.tag_name }}
            type=raw,value=sha-${{ steps.image_tags.outputs.short_sha }}
            type=raw,value=latest,enable=${{ steps.image_tags.outputs.latest == 'true' }}

      - name: Build and push api
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ env.PUBLISH_IMAGE == 'true' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ env.PUBLISH_IMAGE == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

  build-web:
    needs: quality-gate
    timeout-minutes: 90
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout private source
        uses: actions/checkout@v7
        with:
          repository: ${{ env.CHECKOUT_REPOSITORY }}
          ref: ${{ env.CHECKOUT_REF }}
          token: ${{ secrets.SPEAK_REPO_TOKEN }}
          persist-credentials: false

      - name: Resolve image tags
        id: image_tags
        run: |
          set -euo pipefail

          ref_input='${{ env.CHECKOUT_REF }}'
          ref_name="$ref_input"
          latest=false

          if [[ "$ref_input" == refs/tags/* ]]; then
            ref_name="${ref_input#refs/tags/}"
            latest=true
          elif [[ "$ref_input" == refs/heads/* ]]; then
            ref_name="${ref_input#refs/heads/}"
            if [[ "$ref_name" == "main" ]]; then
              latest=true
            fi
          elif [[ "$ref_input" == refs/pull/* ]]; then
            ref_name="pr-${ref_input#refs/pull/}"
            ref_name="${ref_name%%/*}"
          elif [[ "$ref_input" == v* ]]; then
            ref_name="$ref_input"
            latest=true
          elif [[ "$ref_input" == "main" ]]; then
            ref_name=main
            latest=true
          elif [[ -z "$ref_input" ]]; then
            ref_name=detached
          fi

          tag_name="$(printf '%s' "$ref_name" | sed 's/[^A-Za-z0-9_.-]/-/g')"

          echo "tag_name=$tag_name" >> "$GITHUB_OUTPUT"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        if: env.PUBLISH_IMAGE == 'true'
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to registry
        if: env.PUBLISH_IMAGE == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.REGISTRY_USERNAME }}
          password: ${{ secrets.SPEAK_REPO_TOKEN }}

      - name: Extract Docker metadata (web)
        id: meta_web
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.WEB_IMAGE_NAME }}
          tags: |
            type=raw,value=web-${{ steps.image_tags.outputs.tag_name }}
            type=raw,value=web-sha-${{ steps.image_tags.outputs.short_sha }}
            type=raw,value=web-latest,enable=${{ steps.image_tags.outputs.latest == 'true' }}

      - name: Build and push web
        uses: docker/build-push-action@v7
        with:
          context: ./web
          file: ./web/Dockerfile
          platforms: ${{ env.PUBLISH_IMAGE == 'true' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ env.PUBLISH_IMAGE == 'true' }}
          tags: ${{ steps.meta_web.outputs.tags }}
          labels: ${{ steps.meta_web.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_API_URL=/speak/api/v1
            NEXT_PUBLIC_BASE_PATH=/speak
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
