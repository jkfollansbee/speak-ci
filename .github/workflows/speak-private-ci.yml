name: Speak Private CI

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Branch, tag, or full ref from jkfollansbee/speak to build
        required: false
        type: string
        default: main
      publish_image:
        description: Push images to GHCR under jkfollansbee/speak
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  speak:
    uses: jkfollansbee/speak/.github/workflows/reusable-docker-publish.yml@main
    with:
      source_repository: jkfollansbee/speak
      source_ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || (github.event_name == 'pull_request' && github.head_ref || github.ref_name) }}
      publish_repository: jkfollansbee/speak
      publish_image: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_image || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) }}
    secrets:
      private_repo_token: ${{ secrets.SPEAK_REPO_TOKEN }}
